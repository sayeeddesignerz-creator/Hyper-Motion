[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hypermotion"
version = "1.0.0"
description = "Multi-Agent Autonomous Content Research, Scriptwriting, SEO & Facebook Growth Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sayeeddesignerz-creator" }]
keywords = [
    "ai", "automation", "content-generation", "facebook", "seo",
    "multi-agent", "fastapi", "social-media", "growth-engine"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core Web & API
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sse-starlette>=2.0.0,<3.0.0",
    # LLM Providers
    "google-genai>=1.0.0,<2.0.0",
    "openai>=1.30.0,<2.0.0",
    # Intelligence & Data Tools
    "feedparser>=6.0.0,<7.0.0",
    "pytrends>=4.9.0,<5.0.0",
    "rapidfuzz>=3.9.0,<4.0.0",
    "tenacity>=8.3.0,<10.0.0",
    # Storage
    "aiosqlite>=0.20.0,<1.0.0",
    # Scheduling & Utilities
    "apscheduler>=3.10.4,<4.0.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-httpx>=0.30.0,<1.0.0",
]

[project.urls]
Homepage   = "https://github.com/sayeeddesignerz-creator/Hyper-Motion"
Repository = "https://github.com/sayeeddesignerz-creator/Hyper-Motion"
Issues     = "https://github.com/sayeeddesignerz-creator/Hyper-Motion/issues"

# ── CLI entry point ────────────────────────────────────────────────────────────
# After `pip install hypermotion`, users get the `hypermotion` command globally.
[project.scripts]
hypermotion = "hypermotion_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "dashboard*"]

[tool.setuptools.package-data]
"*" = [
    "dashboard/*.html",
    ".env.example",
]
